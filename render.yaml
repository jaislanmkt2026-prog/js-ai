services:
  - type: web
    name: js-ai-plataforma
    runtime: node
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PIX_GATEWAY
        value: mercadopago
      - key: NIMO_API_BASE
        value: https://canboso.com
      - key: NIMO_BUYER_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        sync: false
